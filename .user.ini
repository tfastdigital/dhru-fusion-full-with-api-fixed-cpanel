; ---------------------------------------------------------------------------
; Security hardening (23 Oct 2026). Reduces PHP2Shell (CVE-2026-109618 /
; CVE-2026-109619) exposure: the public exploit path abuses session
; upload-progress tracking, which this app does not use. This is NOT a fix:
; the server must still run a patched PHP (8.2.35+ / 8.3.36+ / 8.4.27+ / 8.5.12+).
; expose_php is PHP_INI_SYSTEM: the line below is ignored on most hosts, so also set
; it Off in hPanel > PHP Options (X-Powered-By is also stripped in .htaccess).
; ---------------------------------------------------------------------------
session.upload_progress.enabled = 0
session.use_strict_mode = 1
session.cookie_httponly = 1
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
