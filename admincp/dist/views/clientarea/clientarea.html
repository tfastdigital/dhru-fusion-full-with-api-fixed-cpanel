<div>
    <div class="p-3">


        <div class="row">
            <div class="col">
                <div class="card">
                    <div class="card-body cursor-pointer">
                        <h5 class="card-title"> {{loginuser.fullname}} </h5>
                        <h5 class="card-title"> {{loginuser.phone}} </h5>
                        <h4 class="card-title">
                            <span style="font-size: 16px"> Balance </span>
                            <br/>
                            <strong class="text-{{loginuser.balancetype=='CR'?'success':'danger'}}">{{loginuser.balance|currency}} {{loginuser.balancetype}}</strong>
                        </h4>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col mb-4" ng-repeat="(key,s) in status">
                <div class="card">
                    <div class="card-body cursor-pointer"  ui-sref="orders({status:s.statusid})"  >
                        <h1 class="card-title"> {{orderbystatus[s.statusid]?orderbystatus[s.statusid]:0}} </h1>
                        <div><small> {{findby(status,{statusid:s.statusid})[0].status}} Order </small></div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<br/><br/><br/>
<div class="position-fixed p-2 bg-white w-100" style="bottom: 0">
    <input type="button" ui-sref="placeorder" class="btn btn-primary btn-lg w-100" value="Place Order" />
</div>
